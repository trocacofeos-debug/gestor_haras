<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestor Haras — gestão administrativa, financeira e comercial.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gestor Haras">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestor Haras</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f3f6fa;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(79, 70, 229, .09), transparent 34%),
        linear-gradient(145deg, #f8fafc, #e7edf5);
      transition: opacity .25s ease;
    }

    .loading-card {
      min-width: 240px;
      padding: 30px 34px;
      border: 1px solid #dbe3ee;
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 20px 55px rgba(15, 23, 42, .12);
      text-align: center;
    }

    .loading-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(145deg, #6366f1, #4338ca);
      box-shadow: 0 10px 24px rgba(79, 70, 229, .28);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .loading-title {
      margin: 0;
      color: #172033;
      font-size: 18px;
      font-weight: 750;
    }

    .loading-text {
      margin: 7px 0 18px;
      color: #64748b;
      font-size: 12px;
    }

    .loading-bar {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      animation: loading-slide 1.15s ease-in-out infinite;
    }

    @keyframes loading-slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(340%); }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-mark">GH</div>
      <p class="loading-title">Gestor Haras</p>
      <p class="loading-text">Preparando seu ambiente de gestão...</p>
      <div class="loading-bar"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.style.opacity = '0';
      window.setTimeout(function () { loading.remove(); }, 260);
    });
  </script>
</body>
</html>
